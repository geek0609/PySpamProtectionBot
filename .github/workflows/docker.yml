name: Docker

on:
  push:
    branches:
      - master
      - main
      - dev
      - 'release/**'
    tags:
      - '*'
  pull_request:
    branches:
      - master
      - main
      - dev

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: PySpamProtectionBot

      # The Dockerfile takes PyFederation from a named build context, its dev branch checked out next
      # to this one.
      - name: Checkout PyFederation
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/PyFederation
          ref: dev
          path: PyFederation

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=sha,enable=false
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
          labels: |
            org.opencontainers.image.title=PySpamProtectionBot
            org.opencontainers.image.description=Telegram spam-protection bot backed by the Open Federated Database specification

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v5
        with:
          context: PySpamProtectionBot
          file: PySpamProtectionBot/Dockerfile
          build-contexts: pyfederation=PyFederation
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ github.event.repository.pushed_at }}
            REVISION=${{ github.sha }}

      - name: Generate artifact attestation
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: false
