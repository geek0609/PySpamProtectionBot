    federation_access_authenticated: "Autenticado (permisos de cliente)"
    federation_access_anonymous: "Anónimo"
  scanning:
    title: "\U0001F50E <b>Escaneo</b>\n\n"
    description: "Comprueba cada mensaje de los miembros en busca de spam, phishing, malware y otras amenazas según las recomendaciones de la Federación. La forma en que responde el bot depende del comportamiento que elija.\n\n"
    privacy_mode_note: "El escaneo solo envía el texto del mensaje o el pie de foto. No publica al remitente ni consulta el registro del remitente en la Federación."
    status: "<b>Estado:</b> {0}"
    block_ads_trackers: "<b>Bloquear anuncios y rastreadores:</b> {0}"
    block_ads_trackers_description: "También analiza los mensajes en busca de publicidad y rastreo según las categorías admitidas por el servidor de la Federación. Habilitado por defecto."
    enable_ads_trackers: "Activar bloqueo de anuncios y rastreadores"
    disable_ads_trackers: "Desactivar bloqueo de anuncios y rastreadores"
    level: "<b>Nivel:</b> {0}"
    notifications: "<b>Notificaciones:</b> {0}"
    notifications_unavailable: "<b>Notificaciones:</b> No disponibles hasta que se habiliten las notificaciones para moderadores o se vincule un chat"
    behavior_passive: "Pasivo"
    behavior_passive_description: "Solo emite notificaciones y no toma ninguna acción automatizada. Disponible solo mientras las notificaciones de escaneo estén habilitadas, para que los moderadores puedan revisar los hallazgos y actuar por su cuenta."
    behavior_moderate: "Moderado"
    behavior_moderate_description: "Elimina contenido bloqueado y restringe a los miembros que la Federación recomienda bloquear. Los mensajes advertidos se eliminan solo cuando no son texto plano sin URLs."
    behavior_strict: "Estricto"
    behavior_strict_description: "Elimina contenido bloqueado, restringe a los miembros advertidos a mensajes de texto únicamente y banea a los miembros que la Federación recomienda bloquear, de forma temporal o permanente. Se eliminan los mensajes advertidos que no sean de texto."
  join_protection:
    title: "\U0001F6C2 <b>Protección al unirse</b>\n\n"
    description: "Comprueba a cada nuevo miembro con los registros de la Federación cuando se une. El modo Pasivo aprueba miembros y puede reportar recomendaciones de bloqueo a los moderadores. El modo Moderado aprueba miembros y restringe a quienes la Federación recomienda bloquear, y puede rechazar la solicitud de ingreso de un miembro bloqueado. El modo Estricto banea a los miembros que la Federación recomienda bloquear; se rechazan las solicitudes de ingreso de dichos miembros. Las recomendaciones temporales terminan a la hora indicada por la Federación.\n\n"
    privacy_mode_note: "La protección al unirse sigue consultando al nuevo miembro para proteger el chat, pero no publica el perfil ni los metadatos del miembro."
    status: "<b>Estado:</b> {0}"
    level: "<b>Nivel:</b> {0}"
    notifications: "<b>Notificaciones:</b> {0}"
    notifications_unavailable: "<b>Notificaciones:</b> No disponibles hasta que se habiliten las notificaciones para moderadores o se vincule un chat"
    behavior_moderate: "Moderado"
    behavior_moderate_description: "Aprueba miembros y restringe a aquellos que la Federación recomienda bloquear, y puede rechazar la solicitud de ingreso de un miembro bloqueado en lugar de banearlo."
    behavior_passive: "Pasivo"
    behavior_passive_description: "Aprueba miembros y no los restringe ni banea automáticamente. Puede reportar las recomendaciones de bloqueo de la Federación a los moderadores."
    behavior_strict: "Estricto"
    behavior_strict_description: "Banea a los miembros que la Federación recomienda bloquear, de forma temporal o permanente. Las solicitudes de ingreso de dichos miembros son rechazadas."
  privacy:
    title: "\U0001F6E1\uFE0F <b>Modo de privacidad</b>\n\n"
    description: "Minimiza los datos rutinarios enviados a la Federación. Detiene la publicación automática de entidades y hace que el escaneo solo envíe el contenido del mensaje, sin consultar al remitente. Las funciones que necesitan datos para funcionar siguen enviando lo mínimo requerido: La Protección al unirse consulta a un nuevo miembro sin publicar su perfil, y los reportes incluyen su objetivo, incidente y evidencia requerida.\n\n"
    status: "<b>Estado:</b> {0}"
  reporting:
    title: "\U0001F4DD <b>Reportes</b>\n\n"
    description: "Permite a los miembros del chat reportar mensajes con <code>/report</code>. Los reportes incluyen el tipo de incidente seleccionado y el mensaje reportado como evidencia.\n\n"
    privacy_mode_note: "Los reportes siguen incluyendo al miembro reportado, el tipo de incidente, el contenido del mensaje y el comentario necesarios para enviarlos. Se omiten los metadatos del chat, del informante y del mensaje, además de los archivos adjuntos."
    status: "<b>Estado:</b> {0}"
    notifications: "<b>Notificaciones:</b> {0}"
    notifications_unavailable: "<b>Notificaciones:</b> No disponibles hasta que se habiliten las notificaciones para moderadores o se vincule un chat"
  moderator_notifications:
    title: "\U0001F514 <b>Notificaciones para moderadores</b>\n\n"
    description: "Cuando está habilitado, cada moderador activo que pueda eliminar mensajes o restringir miembros recibe notificaciones de moderación en privado.\n\n"
    status: "<b>Estado:</b> {0}"
  channel:
    title: "\U0001F517 <b>Vínculo de chat</b>\n\n"
    description: "Conecte un canal o grupo que deba recibir notificaciones de moderación. El bot debe estar presente en el chat de destino antes de poder entregar notificaciones allí.\n\n"
