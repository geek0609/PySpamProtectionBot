start:
  session_expired_private: "Esta sesión de configuración ha expirado o no es válida para usted. Envíe /start en el grupo de nuevo para configurar el bot."
  startgroup_promote: "Para comenzar, promueva este bot a administrador con el permiso <b>Cambiar la información del grupo</b>, luego envíe /start en este chat."
  private_description: "Este es un cliente de Base de Datos Federada Abierta de código abierto para Telegram, que permite a los administradores de grupo proteger los chats grupales contra abusos y spam.\n\n"
  getting_started_header: "<b>Primeros pasos</b>\n"
  getting_started_private_body: "Añada este bot a un chat grupal y promuévalo a administrador con los permisos necesarios para proteger el chat contra spammers.\n\nO abra Telegram &gt; Ajustes &gt; Cuenta &gt; Automatización de chats, conecte este bot y otórguele los permisos de <b>Leer mensajes</b> y <b>Eliminar mensajes recibidos</b> para protegerse contra contactos desconocidos.\n"
  getting_started_group_configurable: "El bot se puede configurar en privado haciendo clic en el botón Configurar a continuación.\n"
  getting_started_group_permissions: "Para comenzar, asegúrese de que este bot tenga los siguientes permisos:\n\u2022 Cambiar la información del grupo\n\u2022 Eliminar mensajes (Opcional)\n\u2022 Banear usuarios (Opcional)\nUna vez configurado, envíe el comando /start de nuevo\n"
  additional_help_header: "\n<b>Ayuda</b>\n"
  additional_help_body: "Envíe /help para abrir el menú de ayuda del bot, que explica qué comandos están disponibles y cómo funcionan.\n"
  server_information_header: "\n<b>Información de la Federación</b>\n"
  server_name_label: "<b>Nombre del servidor:</b> {0}\n"
  server_host_label: "<b>Host del servidor:</b> {0}\n"
  server_api_version_label: "<b>Versión de la API del servidor:</b> {0}\n"

bot_added:
  permissions_required: "<b>¡Gracias por añadirme!</b>\n\nPara proteger este chat, promuéveme a administrador con los siguientes permisos:\n\u2022 Cambiar la información del grupo\n\u2022 Eliminar mensajes (Opcional)\n\u2022 Bloquear usuarios (Opcional)\n\nUna vez hecho, un administrador puede enviar /settings para configurarme."
  ready: "<b>Listo para proteger este chat</b>\n\nUn administrador con el permiso Cambiar la información del grupo puede enviar /settings para configurarme."

settings:
  admin_required: "Solo los administradores del grupo con el permiso <b>Cambiar la información del grupo</b> pueden abrir el menú de ajustes."
  anonymous_sender: "Este comando se envió en nombre de un chat, por lo que no puedo saber qué administrador lo envió. Envíe <code>/settings</code> desde su propia cuenta para abrir el menú de ajustes; los administradores anónimos deben desactivar primero <b>Permanecer anónimo</b>."
  bot_admin_required: "El bot debe ser un administrador con el permiso <b>Cambiar la información del grupo</b> para mostrar el menú de ajustes."
  secretary_not_enabled: "<b>El modo secretaría está deshabilitado.</b>\n\nPara configurar la protección de grupo, añada el bot a un grupo y envíe <code>/start</code> allí. Para usar el modo secretaría, abra Telegram &gt; Ajustes &gt; Telegram Business y añada este bot como administrador, otorgándole permiso para eliminar mensajes."

secretary:
  enabled_title: "\U0001F464 <b>Modo secretaría habilitado</b>\n\n"
  enabled_body: "Me ha convertido en su secretaría personal. Los mensajes de personas que no conoce previamente ahora son supervisados. La Federación escanea sus mensajes o consulta sus registros y recomienda si se requiere alguna acción."
  disabled_title: "\U0001F464 <b>Modo secretaría deshabilitado</b>\n\n"
  disabled_body: "Su conexión de secretaría ha sido deshabilitada y su configuración eliminada. Los mensajes enviados a su cuenta ya no se procesan."
  missing_permissions_title: "\u26A0\uFE0F <b>Permisos faltantes</b>\n\n"
  missing_permissions_body: "Para trabajar como su secretaría, actualmente necesito los siguientes permisos en Telegram Business:"
  missing_permissions_hint: "Otorgue los permisos faltantes y luego vuelva a conectarme."
  permission_item: "\u2022 {0}\n"
  permission_can_delete_all_messages: "Eliminar mensajes recibidos"
  notification_allowed_title: "<b>#CONTACTO_PERMITIDO</b>\n"
  notification_allowed_body: "La Federación no encontró motivo para rechazar este contacto por primera vez. Los futuros mensajes de este contacto no serán escaneados."
