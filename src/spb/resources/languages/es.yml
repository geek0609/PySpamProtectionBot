  usage: "<b>Uso</b>\n\n<code>/blacklist &lt;identificador&gt; &lt;uuid_reporte&gt; &lt;tipo&gt; &lt;expira&gt;</code>: añade una entidad a la lista negra basada en un reporte existente.\nResponda a un mensaje y envíe <code>/blacklist &lt;uuid_reporte&gt; &lt;tipo&gt; &lt;expira&gt;</code> para añadir al autor del mensaje a la lista negra basado en un reporte existente.\nResponda a un mensaje y envíe <code>/blacklist &lt;tipo&gt; &lt;expira&gt;</code> para crear un reporte de respaldo y añadir al autor del mensaje a la lista negra.\n\n<code>expira</code> acepta una duración con un sufijo de unidad (<code>s</code>, <code>m</code>, <code>h</code> o <code>d</code>; los números simples se configuran por defecto en segundos), p. ej., <code>30d</code> o <code>12h</code>."
