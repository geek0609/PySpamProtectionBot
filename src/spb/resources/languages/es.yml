blacklist:
  regular_group_note: "\n\n<i>¿Respondiste a un mensaje? En los grupos normales, Telegram no me muestra las respuestas a mensajes enviados antes de que me uniera. Responde a un mensaje más reciente o convierte el grupo en un supergrupo.</i>"
