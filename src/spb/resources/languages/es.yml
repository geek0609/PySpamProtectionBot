secretary_settings:
  title: "\U0001F464 <b>Ajustes de secretaría</b>\n\n"
  description: "Elija cómo el Modo Secretaría gestiona los contactos con los que no ha interactuado antes. El Modo Secretaría mantiene una lista de permitir/denegar para sus conversaciones. Los mensajes de contactos permitidos se entregan normalmente sin eliminarse ni escanearse, mientras que los mensajes de contactos denegados se eliminan automáticamente. Los mensajes de contactos desconocidos se verifican con el servidor de la federación para determinar cómo deben gestionarse."
  behavior: "<b>Comportamiento:</b> {0}"
  behavior_passive: "Pasivo"
  behavior_passive_description: "Solo emite notificaciones y le permite decidir. Se permiten nuevos contactos y su primer mensaje se conserva en su chat después de verifiarlos en la base de datos de la Federación, y siempre se envía una notificación con controles de Permitir y Denegar para que pueda revisar la recomendación y cambiar el estado del contacto."
  behavior_strict: "Estricto"
  behavior_strict_description: "También aplica la denegación cuando corresponda. Los nuevos contactos se permiten o deniegan automáticamente según la recomendación; los mensajes denegados se eliminan y se envía una notificación para cada decisión con controles de Permitir y Denegar para que pueda cambiar el estado del contacto."
  scanning: "<b>Escaneo:</b> {0}"
  scanning_enabled_description: "El texto o la descripción del primer mensaje de un contacto se envía al servidor de la Federación para su análisis junto con el registro del remitente. Si el mensaje se marca por error, su contenido puede aparecer en un reporte de la Federación."
  scanning_disabled_description: "El contenido de los mensajes nunca sale de su chat; solo se verifica el registro del remitente en la Federación."
  enable_scanning: "Habilitar escaneo"
  disable_scanning: "Deshabilitar escaneo"
  contact_not_known: "\U0001F4AC <b>Contacto desconocido</b>\n\nCuando una persona nueva le envía un mensaje por primera vez, se verifica en la Base de Datos de la Federación. Luego se le permite o deniega automáticamente y usted recibe una notificación."
  contact_not_known_button: "Abrir ajustes de secretaría"
  contact_unknown: "Desconocido"
  contact_allowed: "Permitido"
  contact_denied: "Denegado"
  contact_title: "<b>Ajustes del contacto</b>\n\n"
  contact_status: "<b>Estado:</b> {0}\n"
  contact_not_known_hint: "<i>Este contacto aún no está en su lista de permitir/denegar.</i>\n\n"
  toast_behavior_changed: "Comportamiento de secretaría cambiado a {0}."
  toast_scanning_enabled: "Escaneo habilitado."
  toast_scanning_disabled: "Escaneo deshabilitado."
  toast_contact_allowed: "Contacto permitido."
  toast_contact_denied: "Contacto denegado."
  session_expired: "Este menú de ajustes ha expirado. Envíe /settings para abrirlo de nuevo."
  not_enabled: "\u26A0\uFE0F <b>El modo secretaría no está habilitado.</b>\n\nAbra Telegram &gt; Ajustes &gt; Telegram Business, conecte este bot a su cuenta y otórguele permiso para eliminar mensajes. Esta restricción se elimina y sus ajustes se muestran tan pronto como exista la conexión."

