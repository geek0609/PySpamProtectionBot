help_pages:
  main_title: "Ayuda"
  main_body: "Use los botones a continuación para obtener información sobre cada función.\n\n<b>General</b>\n\u2022 <code>/help</code>: Muestra este menú de ayuda\n\u2022 <code>/start</code>: Añade el bot a un grupo o abre tu menú privado\n\u2022 <code>/settings</code>: Abre el menú de configuración\n\u2022 <code>/language</code>: Cambia tu idioma (alias: <code>/lang</code>)\n\u2022 <code>/ping</code>: Comprueba el estado del bot y del servidor de la Federación\n\n<b>Protección de chat</b>\n\u2022 <code>/report</code>: Reporta un mensaje o busca un reporte existente por UUID\n\u2022 <code>/connect</code>: Vincula un chat o canal de notificaciones\n\n<b>Consultas de la Federación</b>\n\u2022 <code>/info</code>: Consulta el registro de una entidad de la Federación y su recomendación\n\u2022 <code>/evidence</code>: Consulta un registro de evidencia de la Federación por UUID\n\n<b>Operadores de la Federación</b>\n\u2022 <code>/auth</code>: Inicia sesión con un token de acceso a la Federación\n\u2022 <code>/authinfo</code>: Muestra tu identidad de operador y permisos\n\u2022 <code>/deauth</code>: Cierra sesión\n\u2022 <code>/blacklist</code>: Añade una entidad a la lista negra basada en un reporte\n\u2022 <code>/link</code>: Vincula dos entidades de la Federación"
  secretary_mode_title: "Modo Secretaría"
  secretary_mode_body: "<b>Modo secretaría</b>\n\nEl modo secretaría protege tu bandeja de entrada personal contra contactos desconocidos. Para usarlo, abre Telegram &gt; Ajustes &gt; Cuenta &gt; Automatización de chats, conecta este bot y otórgale los permisos de <b>Leer mensajes</b> y <b>Eliminar mensajes recibidos</b>.\n\nCuando un contacto desconocido te envía un mensaje por primera vez, el bot lo verifica con el servidor de la Federación y luego lo gestiona automáticamente según el comportamiento que elijas:\n\n\u2022 <b>Pasivo</b>: El primer mensaje siempre se permite y se conserva. Se te notifica cada decisión para que puedas revisar el contacto y cambiarlo si es necesario.\n\u2022 <b>Estricto</b>: El contacto se permite o deniega automáticamente. Los mensajes denegados se eliminan y se te notifica cada decisión.\n\nCada notificación incluye botones de <b>Permitir</b> y <b>Denegar</b> para que puedas anular la decisión del bot. Una vez que permites un contacto, este es de confianza y ya no se verifica; una vez que lo deniegas, sus mensajes se eliminan silenciosamente. También puedes gestionar los contactos y los ajustes en el menú de Secretaría."
  chat_protection_title: "Protección de Chat"
  chat_protection_body: "<b>Protección de Chat</b>\n\nLa protección de chat convierte al bot en un moderador que combate el spam y los abusos en un chat grupal. Añade el bot a tu grupo, promuévelo a administrador y habilita la protección desde el menú de configuración abierto con <code>/start</code> o <code>/settings</code> en el chat. Un grupo protegido puede utilizar cualquier combinación de estas funciones:\n\n\u2022 <b>Escaneo</b>: Los mensajes se verifican con el servidor de la Federación en busca de spam, phishing, malware y otras amenazas. Según el comportamiento, el bot puede notificar a los moderadores, eliminar contenido marcado, restringir al remitente o banearlo.\n\u2022 <b>Protección al unirse</b>: Los nuevos miembros se verifican con el servidor de la Federación al unirse, de modo que los actores maliciosos conocidos pueden ser restringidos o rechazados antes de que causen daños.\n\u2022 <b>Reportes</b>: Los miembros pueden usar <code>/report</code> para marcar mensajes, y los reportes se comparten con la red de la Federación. A diferencia del Escaneo y la Protección al unirse, esto siempre requiere el propio token de acceso a la Federación del bot para llevar permisos de cliente, sin ruta anónima.\n\nCada función tiene su propio nivel de protección y ajustes de notificación, para que puedas ajustar exactamente cuán estricto debe ser el bot. Se notifica a los moderadores sobre cualquier acción siempre que las notificaciones estén habilitadas."
  settings_title: "Ajustes"
  settings_body: "El comando <code>/settings</code> abre el menú de configuración del bot, donde puedes activar o desactivar funciones y ajustar cómo se comporta el bot. Funciona de manera diferente según dónde lo envíes.\n\nSelecciona un ajuste a continuación para obtener más información."
  settings_scanning_title: "Escaneo"
  settings_scanning_body: "El escaneo funciona solo en chats grupales. Cuando está habilitado, el bot verifica el contenido de cada mensaje de los miembros con el servidor de la Federación en busca de spam, phishing, malware y otras amenazas. A menos que el Modo de Privacidad esté activado, también verifica al autor con su registro en la Federación. La forma en que responde el bot depende del comportamiento que elijas:\n\n\u2022 <b>Pasivo</b>: Solo notifica a los moderadores; no se toma ninguna acción automática. Está disponible solo mientras las notificaciones de escaneo estén habilitadas.\n\u2022 <b>Moderado</b>: El contenido bloqueado se elimina y los miembros que la Federación recomienda bloquear son restringidos.\n\u2022 <b>Estricto</b>: El contenido bloqueado se elimina, los miembros advertidos son restringidos a solo mensajes de texto y los miembros que la Federación recomienda bloquear son baneados.\n\nLos mensajes advertidos se gestionan de la misma manera tanto en el nivel Moderado como en el Estricto: se eliminan solo cuando son algo distinto de un mensaje de texto plano sin URLs. Se eliminan fotos, videos, stickers, otros medios, mensajes que contienen enlaces y mensajes sin texto, mientras que se conservan los mensajes de texto básicos sin URLs. Cuando las notificaciones de escaneo están habilitadas, se alerta a los moderadores sobre la acción tomada. Cuando el Modo de Privacidad está activado, solo se envía el texto del mensaje o el pie de foto a la Federación; no se publica ni se busca al remitente."
  settings_join_protection_title: "Protección al unirse"
  settings_join_protection_body: "La protección al unirse funciona solo en chats grupales. Cuando está habilitada, cada nuevo miembro se verifica con el servidor de la Federación al unirse, de modo que los actores maliciosos conocidos pueden detenerse antes de que causen daños. El comportamiento que elijas controla lo que sucede:\n\n\u2022 <b>Pasivo</b>: Se aprueban todos los ingresos y se informan las recomendaciones de bloqueo de la Federación a los moderadores.\n\u2022 <b>Moderado</b>: Se aprueban los ingresos, pero los miembros que la Federación recomienda bloquear son restringidos; la solicitud de ingreso de un miembro bloqueado puede ser rechazada.\n\u2022 <b>Estricto</b>: Los miembros que la Federación recomienda bloquear son baneados y sus solicitudes de ingreso son rechazadas.\n\nCuando las notificaciones de protección al unirse están habilitadas, se alerta a los moderadores sobre cualquier acción tomada. Cuando el Modo de Privacidad está activado, el bot sigue consultando al nuevo miembro para proteger el chat, pero no publica su perfil."
  settings_reporting_title: "Reportes"
  settings_reporting_body: "La función de reportar funciona solo en chats grupales. Los miembros pueden responder a un mensaje y enviar <code>/report</code> para marcarlo. Cada reporte incluye el tipo de incidente seleccionado y el mensaje reportado como evidencia.\n\nEl reporte notifica a los moderadores para que puedan revisarlo, y también se envía una copia al servidor de la Federación. Los operadores en el servidor de la Federación utilizan estos reportes para mejorar la base de datos, ayudando a identificar spam, phishing, malware y otras amenazas. Cuando el Modo de Privacidad está activado, solo se comparte lo mínimo necesario para enviar un reporte: el miembro reportado, el tipo de incidente, el contenido del mensaje y el comentario.\n\nEnviar un reporte siempre requiere el propio token de acceso a la Federación del bot para llevar permisos de cliente; no hay una ruta anónima para ello en el servidor. Cuando el bot no tiene uno, esta página no aparece en <code>/settings</code> y <code>/report</code> explica el porqué."
  settings_privacy_title: "Modo de privacidad"
  settings_privacy_body: "El modo de privacidad es un ajuste de protección de grupo que minimiza los datos rutinarios enviados al servidor de la Federación mientras el bot continúa protegiendo el chat. Detiene la publicación automática de usuarios y hace que el escaneo solo envíe el texto del mensaje o el pie de foto en lugar de buscar también al remitente.\n\nLas funciones que necesitan datos siguen enviando lo mínimo requerido para funcionar: La Protección al unirse sigue consultando a los nuevos miembros sin publicar sus perfiles, y los reportes incluyen el miembro reportado, el tipo de incidente, el contenido del mensaje y el comentario necesarios para enviarlos."
  settings_moderator_notifications_title: "Notificaciones para moderadores"
  settings_moderator_notifications_body: "Las notificaciones para moderadores funcionan solo en chats grupales. Cuando están habilitadas, cada moderador activo que pueda eliminar mensajes o restringir miembros recibe alertas en privado cada vez que el bot toma una acción, cubriendo eventos de escaneo, protección al unirse y reportes. Esta es una forma de entregar notificaciones; la otra es un chat de notificaciones vinculado."
  settings_channel_linking_title: "Vínculo de chat"
  settings_channel_linking_body: "El vínculo de chat funciona solo en chats grupales. Conecta un canal o grupo separado que también recibe las notificaciones de moderación que envía el bot, para que puedas mantener un registro dedicado de su actividad. El bot debe estar presente en el chat vinculado antes de poder entregar notificaciones allí."
  federation_commands_title: "Comandos de la Federación"
  federation_commands_body: "<b>Comandos de la Federación</b>\n\nEstos comandos buscan información de la Federación o envían un reporte. Disponibles en cualquier chat.\n\n\u2022 <code>/info [objetivo]</code>: Busca el registro de una entidad en la Federación: reputación, estado en la lista blanca, relación contigo, además de la evaluación de la Federación con su acción sugerida y listas negras activas. Sin un objetivo, responder a un mensaje busca a su autor; enviado directamente, te busca a ti mismo. Un objetivo también puede ser un nombre de usuario, ID de usuario, dirección de entidad, UUID o hash.\n\u2022 <code>/evidence &lt;uuid&gt;</code>: Busca un registro de evidencia por su ID. Muestra su clasificación, contenido, nota, la entidad que concierne, quién lo envió y el reporte al que pertenece; en chats grupales la respuesta solo se muestra a ti.\n\u2022 <code>/report</code>: Responde a un mensaje en un grupo y envía <code>/report</code> para abrir el diálogo de reporte, o envía <code>/report &lt;tipo&gt; [comentario]</code> para enviarlo directamente. Reenviar un mensaje al bot en privado lo reporta de la misma manera.\n\u2022 <code>/report &lt;uuid&gt;</code>: Busca un reporte existente por su UUID. Muestra el ID del reporte, tipo, estado, la entidad reportada, quién lo envió y cualquier evidencia.\n\nEnviar un reporte siempre requiere el propio token de acceso a la Federación del bot para llevar permisos de cliente. A diferencia de las consultas anteriores, no hay una ruta anónima para ello en el servidor."
  operator_usage_title: "Uso de operador"
  operator_usage_body: "El uso de operador es para los operadores de la Federación, identificados con <code>/auth</code>. Estos comandos se ejecutan con los propios permisos del operador que llama en lugar de los del bot.\n\nSelecciona un tema a continuación para obtener más información."
  operator_authentication_title: "Autenticación"
  operator_authentication_body: "<b>Autenticación</b>\n\nTe identifica como un operador de la Federación mediante un token de acceso emitido en el servidor de la Federación. Se usa en tu chat privado con el bot.\n\n\u2022 <code>/auth &lt;access_token&gt;</code>: Te identifica con un token de acceso.\n\u2022 <code>/authinfo</code>: Muestra tu identidad de operador actual y tus permisos: derechos de cliente, operador, gestión y asignación automática.\n\u2022 <code>/deauth</code>: Revoca tu credencial almacenada y cierra tu sesión.\n\nLos comandos que necesitan un operador autenticado (<code>/blacklist</code>, <code>/link</code> y el cierre de un reporte asignado) usan tu propia credencial almacenada, nunca la del bot."
  operator_blacklist_title: "Uso de lista negra"
  operator_blacklist_body: "<b>Uso de lista negra</b>\n\n<code>/blacklist</code> añade una entidad a la lista negra en el servidor de la Federación, respaldada por un reporte de apoyo. Acepta tres formas:\n\n\u2022 <code>/blacklist &lt;identificador&gt; &lt;uuid_reporte&gt; &lt;tipo&gt; &lt;expira&gt;</code>: añade a la lista negra a la entidad dada basándose en un reporte existente.\n\u2022 <code>/blacklist &lt;uuid_reporte&gt; &lt;tipo&gt; &lt;expira&gt;</code> (respuesta): añade a la lista negra al autor del mensaje respondido basándose en un reporte existente.\n\u2022 <code>/blacklist &lt;tipo&gt; &lt;expira&gt;</code> (respuesta): crea primero un reporte de apoyo para el autor del mensaje respondido y luego lo añade a la lista negra basándose en él.\n\n<code>expira</code> es una duración con un sufijo de unidad (<code>s</code>, <code>m</code>, <code>h</code>, <code>d</code>; un número simple se configura por defecto en segundos), p. ej., <code>30d</code> o <code>12h</code>. Esto requiere derechos de gestión en el servidor de la Federación, verificados contra tus propios permisos de operador."
  operator_linking_title: "Vincular entidades"
  operator_linking_body: "<b>Vincular entidades</b>\n\n<code>/link &lt;entidad&gt; &lt;objetivo&gt; &lt;tipo&gt;</code> registra que la <code>entidad</code> se relaciona con el <code>objetivo</code> de la manera que describe el <code>tipo</code>:\n\n• <b>alternative</b>: la <code>entidad</code> es una sospecha de cuenta secundaria (alt) del <code>objetivo</code>; es posible que el vínculo no esté confirmado.\n• <b>proxy</b>: se confirma que la <code>entidad</code> actúa en nombre del <code>objetivo</code>, p. ej., retransmitiendo sus mensajes.\n• <b>child</b>: la <code>entidad</code> fue creada por el <code>objetivo</code> como dependiente, p. ej., una cuenta de bot configurada por el <code>objetivo</code>.\n\nLa <code>entidad</code> y el <code>objetivo</code> pueden ser nombres de usuario, IDs de usuario de Telegram, menciones, UUIDs de la Federación, hashes o direcciones de entidad.\n\nCada entidad conserva solo un vínculo saliente a la vez; vincularla de nuevo reemplaza el objetivo anterior en lugar de añadirlo. Sin embargo, un objetivo puede tener cualquier número de entidades vinculadas a él, que es como se conectan varias cuentas entre sí: vincula cada alt, proxy o cuenta secundaria conocida a la misma entidad central en lugar de vincularlas entre sí. Al consultar cualquier entidad en ese grupo, a través de <code>/info</code> o de las comprobaciones automáticas del propio bot, se muestra todo el grupo, por lo que atrapar una cuenta capturada también marca a sus familiares."
  operator_report_assignments_title: "Asignaciones de reportes"
  operator_report_assignments_body: "<b>Asignaciones de reportes</b>\n\nCuando se te asigna un reporte, se envía una notificación <code>#REPORTE_ASIGNADO</code> a tu chat privado. Incluye el ID del reporte, el tipo de incidente, la entidad reportada, quién lo envió, cuándo se creó, el mensaje del reporte y una lista de evidencias.\n\nUsa los botones de la notificación para cerrar el reporte como <b>Normal</b>, <b>Sospechoso</b> o <b>Malicioso</b>. Los botones siguen disponibles hasta que se cierre el reporte."

link:
  usage: "Uso: <code>/link &lt;entidad&gt; &lt;objetivo&gt; &lt;tipo&gt;</code>. La entidad y el objetivo pueden ser nombres de usuario, IDs de usuario de Telegram, menciones, UUIDs de la Federación, hashes o direcciones de entidad. El tipo debe ser uno de los siguientes: <code>alternative</code>, <code>proxy</code> o <code>child</code>."
  not_authenticated: "No está autenticado como operador de la Federación. Use <code>/auth &lt;token&gt;</code> primero."
