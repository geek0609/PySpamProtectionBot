help_pages:
  main_title: "Help"
  main_body: "Use the buttons below to learn about each feature.\n\n<b>General</b>\n\u2022 <code>/help</code>: Show this help menu\n\u2022 <code>/start</code>: Add the bot to a group, or open your private menu\n\u2022 <code>/settings</code>: Open the configuration menu\n\u2022 <code>/language</code>: Change your language (alias: <code>/lang</code>)\n\u2022 <code>/ping</code>: Check the bot's and Federation server's status\n\n<b>Chat Protection</b>\n\u2022 <code>/report</code>: Report a message, or look up an existing report by UUID\n\u2022 <code>/connect</code>: Link a notification chat or channel\n\n<b>Federation Lookups</b>\n\u2022 <code>/info</code>: Look up a Federation entity's record and recommendation\n\u2022 <code>/evidence</code>: Look up a Federation evidence record by UUID\n\n<b>Federation Operators</b>\n\u2022 <code>/auth</code>: Sign in with a Federation access token\n\u2022 <code>/authinfo</code>: Show your operator identity and permissions\n\u2022 <code>/deauth</code>: Sign out\n\u2022 <code>/blacklist</code>: Blacklist an entity against a report\n\u2022 <code>/link</code>: Link two Federation entities"
  secretary_mode_title: "Secretary Mode"
  secretary_mode_body: "<b>Secretary mode</b>\n\nSecretary mode protects your personal inbox from unknown contacts. To use it, open Telegram &gt; Settings &gt; Account &gt; Chat Automation, connect this bot, and grant it the <b>Read Messages</b> and <b>Delete Received Messages</b> permissions.\n\nWhen an unknown contact messages you for the first time, the bot checks them against the Federation server and then handles them automatically based on the behavior you choose:\n\n\u2022 <b>Passive</b>: The first message is always allowed and kept. You are notified of every decision, so you can review the contact and change it if needed.\n\u2022 <b>Strict</b>: The contact is automatically allowed or denied. Denied messages are deleted, and you are notified of every decision.\n\nEvery notification includes <b>Allow</b> and <b>Deny</b> buttons so you can override the bot's decision. Once you allow a contact they are trusted and no longer checked; once you deny one, their messages are silently deleted. You can also manage contacts and settings in the Secretary menu."
  chat_protection_title: "Chat Protection"
  chat_protection_body: "<b>Chat Protection</b>\n\nChat Protection turns the bot into a moderator that fights spam and abuse in a group chat. Add the bot to your group, promote it to administrator, and enable protection from the configuration menu opened with <code>/start</code> or <code>/settings</code> in the chat. A protected group can use any combination of these features:\n\n\u2022 <b>Scanning</b>: Messages are checked against the Federation server for spam, phishing, malware, and other threats. Depending on the behavior, the bot can notify moderators, delete flagged content, restrict the sender, or ban them.\n\u2022 <b>Join protection</b>: New members are checked against the Federation server when they join, so known bad actors can be restricted or declined before they cause damage.\n\u2022 <b>Reporting</b>: Members can use <code>/report</code> to flag messages, and reports are shared with the Federation network. Unlike Scanning and Join Protection, this always needs the bot's own Federation access token to carry client permissions, with no anonymous path.\n\nEach feature has its own protection level and notification settings, so you can tune exactly how strict the bot should be. Moderators are notified about action whenever notifications are enabled."
  settings_title: "Settings"
  settings_body: "The <code>/settings</code> command opens the bot's configuration menu, where you can turn features on or off and adjust how the bot behaves. It works differently depending on where you send it.\n\nSelect a setting below to learn more."
  settings_scanning_title: "Scanning"
  settings_scanning_body: "Scanning works only in group chats. When enabled, the bot checks the content of every member message against the Federation server for spam, phishing, malware, and other threats. Unless Privacy Mode is on, it also checks the author against their Federation record. How the bot responds depends on the behavior you choose:\n\n\u2022 <b>Passive</b>: Only notifies moderators; no automatic action is taken. It is available only while scanning notifications are enabled.\n\u2022 <b>Moderate</b>: Blocked content is deleted, and members Federation recommends blocking are restricted.\n\u2022 <b>Strict</b>: Blocked content is deleted, cautioned members are restricted to text messages only, and members Federation recommends blocking are banned.\n\nCautioned messages are handled the same way at both the Moderate and Strict levels: they are deleted only when they are anything other than a plain text message without URLs. Photos, videos, stickers, other media, messages containing links, and messages without text are removed, while basic text messages with no URLs are kept. When scanning notifications are enabled, moderators are alerted about the action taken. When Privacy Mode is on, only the message text or caption is sent to Federation; the sender is not published or looked up."
  settings_join_protection_title: "Join Protection"
  settings_join_protection_body: "Join Protection works only in group chats. When enabled, every new member is checked against the Federation server as they join, so known bad actors can be stopped before they cause damage. The behavior you choose controls what happens:\n\n\u2022 <b>Passive</b>: All joins are approved and Federation block recommendations are reported to moderators.\n\u2022 <b>Moderate</b>: Joins are approved, but members Federation recommends blocking are restricted; a blocked member's join request can be declined.\n\u2022 <b>Strict</b>: Members Federation recommends blocking are banned, and join requests from them are declined.\n\nWhen join protection notifications are enabled, moderators are alerted about any action taken. When Privacy Mode is on, the bot still queries the new member to protect the chat, but does not publish their profile."
  settings_reporting_title: "Reporting"
  settings_reporting_body: "Reporting works only in group chats. Members can reply to a message and send <code>/report</code> to flag it. Each report includes the selected incident type and the reported message as evidence.\n\nThe report notifies moderators so they can review it, and a copy is also submitted to the Federation server. Operators on the Federation server use these reports to improve the database, so helping identify spam, phishing, malware, and other threats. When Privacy Mode is on, only the minimum needed to submit a report is shared: the reported member, incident type, message content, and comment.\n\nSubmitting a report always needs the bot's own Federation access token to carry client permissions; there is no anonymous path for it on the server. When the bot does not have one, this page does not appear in <code>/settings</code> and <code>/report</code> explains why."
  settings_privacy_title: "Privacy Mode"
  settings_privacy_body: "Privacy Mode is a group protection setting that minimizes the routine data sent to the Federation server while the bot continues to protect the chat. It stops automatically publishing users, and makes scanning send only the message text or caption instead of also looking up the sender.\n\nFeatures that need data still send the minimum required to work: Join Protection still queries new members without publishing their profiles, and reports include the reported member, incident type, message content, and comment needed to submit them."
  settings_moderator_notifications_title: "Moderator Notifications"
  settings_moderator_notifications_body: "Moderator Notifications works only in group chats. When enabled, every active moderator who can delete messages or restrict members receives alerts privately whenever the bot takes action, covering scanning, join protection, and report events. This is one way notifications can be delivered; the other is a linked notification chat."
  settings_channel_linking_title: "Chat Linking"
  settings_channel_linking_body: "Chat Linking works only in group chats. It connects a separate channel or group that also receives the moderation notifications the bot sends, so you can keep a dedicated log of its activity. The bot must be present in the linked chat before it can deliver notifications there."
  federation_commands_title: "Federation Commands"
  federation_commands_body: "<b>Federation Commands</b>\n\nThese commands look up Federation information, or submit a report. Available in any chat.\n\n\u2022 <code>/info [target]</code>: Looks up the Federation record for an entity: reputation, whitelist status, relationship to you, plus the Federation assessment with its suggested action and active blacklists. With no target, replying to a message looks up its author; sent plain, it looks up yourself. A target can also be a username, user id, entity address, UUID, or hash.\n\u2022 <code>/evidence &lt;uuid&gt;</code>: Looks up an evidence record by its ID. Shows its classification, content, note, the entity it concerns, who submitted it, and the report it belongs to; in group chats the response is shown only to you.\n\u2022 <code>/report</code>: Reply to a message in a group and send <code>/report</code> to open the report dialog, or send <code>/report &lt;type&gt; [comment]</code> to submit directly. Forwarding a message to the bot privately reports it the same way.\n\u2022 <code>/report &lt;uuid&gt;</code>: Looks up an existing report by its UUID. Shows the report id, type, status, the reported entity, who submitted it, and any evidence.\n\nSubmitting a report always needs the bot's own Federation access token to carry client permissions. Unlike the lookups above, there is no anonymous path for it on the server."
  operator_usage_title: "Operator Usage"
  operator_usage_body: "Operator Usage is for Federation operators, identified with <code>/auth</code>. These commands run with the calling operator's own permissions rather than the bot's.\n\nSelect a topic below to learn more."
  operator_authentication_title: "Authentication"
  operator_authentication_body: "<b>Authentication</b>\n\nSigns you in as a Federation operator, identified by an access token issued on the Federation server. Used in your private chat with the bot.\n\n\u2022 <code>/auth &lt;access_token&gt;</code>: Signs you in with an access token.\n\u2022 <code>/authinfo</code>: Shows your current operator identity and permissions: client, operator, management, and auto-assign rights.\n\u2022 <code>/deauth</code>: Revokes your stored credential and signs you out.\n\nCommands that need an authenticated operator (<code>/blacklist</code>, <code>/link</code>, and closing an assigned report) use your own stored credential, never the bot's."
  operator_blacklist_title: "Blacklisting"
  operator_blacklist_body: "<b>Blacklisting</b>\n\n<code>/blacklist</code> blacklists an entity on the Federation server, backed by a supporting report. It accepts three forms:\n\n\u2022 <code>/blacklist &lt;identifier&gt; &lt;report_uuid&gt; &lt;type&gt; &lt;expires&gt;</code>: blacklist the given entity against an existing report.\n\u2022 <code>/blacklist &lt;report_uuid&gt; &lt;type&gt; &lt;expires&gt;</code> (reply): blacklist the replied-to message's author against an existing report.\n\u2022 <code>/blacklist &lt;type&gt; &lt;expires&gt;</code> (reply): create a supporting report for the replied-to message's author first, then blacklist them against it.\n\n<code>expires</code> is a duration with a unit suffix (<code>s</code>, <code>m</code>, <code>h</code>, <code>d</code>; a plain number defaults to seconds), e.g. <code>30d</code> or <code>12h</code>. This needs management rights on the Federation server, checked against your own operator permissions."
  operator_linking_title: "Linking Entities"
  operator_linking_body: "<b>Linking Entities</b>\n\n<code>/link &lt;entity&gt; &lt;target&gt; &lt;type&gt;</code> records that <code>entity</code> relates to <code>target</code> the way <code>type</code> describes:\n\n• <b>alternative</b>: <code>entity</code> is a suspected alt account of <code>target</code>; the link may not be confirmed.\n• <b>proxy</b>: <code>entity</code> is confirmed to act on <code>target</code>'s behalf, e.g. relaying its messages.\n• <b>child</b>: <code>entity</code> was created by <code>target</code> as a dependent, e.g. a bot account <code>target</code> set up.\n\n<code>entity</code> and <code>target</code> may be usernames, Telegram user ids, mentions, Federation UUIDs, hashes, or entity addresses.\n\nEach entity holds only one outgoing link at a time; linking it again replaces the previous target rather than adding to it. A target, though, can have any number of entities linking to it, which is how multiple accounts get tied together: link every known alt, proxy, or child to the same central entity rather than to each other. Querying any entity in that cluster, through <code>/info</code> or the bot's own automatic checks, then surfaces the whole group, so catching one caught account also flags its relatives."
  operator_report_assignments_title: "Report Assignments"
  operator_report_assignments_body: "<b>Report Assignments</b>\n\nWhen a report is assigned to you, a <code>#REPORT_ASSIGNED</code> notification is sent to your private chat. It includes the report id, incident type, reported entity, who submitted it, when it was created, the report message, and a list of evidence.\n\nUse the buttons on the notification to close the report as <b>Normal</b>, <b>Suspicious</b>, or <b>Malicious</b>. The buttons stay available until the report is closed."
link:
  usage: "Usage: <code>/link &lt;entity&gt; &lt;target&gt; &lt;type&gt;</code>. The entity and target may be usernames, Telegram user ids, mentions, Federation UUIDs, hashes, or entity addresses. The type must be one of <code>alternative</code>, <code>proxy</code>, or <code>child</code>."
  not_authenticated: "You are not authenticated as a Federation operator. Use <code>/auth &lt;token&gt;</code> first."
  federation_not_configured: "Federation is not configured, so the relationship cannot be set."
  entity_not_found: "No Federation entity matches <code>{0}</code>."
