start:
  session_expired_private: "This configuration session has expired or is not valid for you. Send /start in the group again to configure the bot."
  startgroup_promote: "To get started, promote this bot to an administrator with the <b>Change Group Information</b> permission, then send /start in this chat."
  private_description: "This is an open source Open Federated Database client for Telegram, allowing group administrators to protect group chats from abuse &amp; spam.\n\n"
  getting_started_header: "<b>Getting Started</b>\n"
  getting_started_private_body: "Add this bot to a group chat and promote it to administrator with the required permissions to protect the chat against spammers.\n\nOr open Telegram &gt; Settings &gt; Account &gt; Chat Automation, connect this bot, and grant it the <b>Read Messages</b> and <b>Delete Received Messages</b> permissions to protect yourself against unknown contacts.\n"
  getting_started_group_configurable: "The bot can be configured privately by clicking the Configure button below.\n"
  getting_started_group_permissions: "To get started, ensure that this bot has the following permissions:\n\u2022 Change Group Information\n\u2022 Delete Messages (Optional)\n\u2022 Ban Users (Optional)\nOnce configured, send the /start command again\n"
  additional_help_header: "\n<b>Help</b>\n"
  additional_help_body: "Send /help to open the bot's help menu, which explains what commands are available and how they work.\n"
  server_information_header: "\n<b>Federation Information</b>\n"
  server_name_label: "<b>Server Name:</b> {0}\n"
  server_host_label: "<b>Server Host:</b> {0}\n"
  server_api_version_label: "<b>Server API Version:</b> {0}\n"

bot_added:
  permissions_required: "<b>Thanks for adding me!</b>\n\nTo protect this chat, promote me to administrator with the following permissions:\n\u2022 Change Group Information\n\u2022 Delete Messages (Optional)\n\u2022 Ban Users (Optional)\n\nOnce that is done, an administrator can send /settings to configure me."
  ready: "<b>Ready to protect this chat</b>\n\nAn administrator with the Change Group Information permission can send /settings to configure me."

settings:
  admin_required: "Only group administrators with the <b>Change Group Information</b> permission can open the settings menu."
  anonymous_sender: "This command was sent on behalf of a chat, so I cannot tell which administrator sent it. Send <code>/settings</code> from your own account to open the settings menu; anonymous administrators need to turn off <b>Remain Anonymous</b> first."
  bot_admin_required: "The bot must be an administrator with the <b>Change Group Information</b> permission to show the settings menu."
  secretary_not_enabled: "<b>Secretary mode is disabled.</b>\n\nTo configure group protection, add the bot to a group and send <code>/start</code> there. To use secretary mode, open Telegram &gt; Settings &gt; Business and add this bot as a manager, granting permission to delete messages."

secretary:
  enabled_title: "\U0001F464 <b>Secretary Mode Enabled</b>\n\n"
  enabled_body: "You have made me your personal secretary. Messages from people you have not met before are now watched. Federation scans their messages or queries their records and recommends whether action is needed."
  disabled_title: "\U0001F464 <b>Secretary Mode Disabled</b>\n\n"
  disabled_body: "Your secretary connection has been disabled and your configuration removed. Messages sent to your account are no longer processed."
  missing_permissions_title: "\u26A0\uFE0F <b>Missing Permissions</b>\n\n"
  missing_permissions_body: "To work as your secretary I currently need the following permissions in Telegram Business:"
