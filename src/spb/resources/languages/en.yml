blacklist:
  regular_group_note: "\n\n<i>Replied to a message? In regular groups, Telegram does not show me replies to messages sent before I joined. Reply to a newer message, or upgrade the group to a supergroup.</i>"
  federation_not_configured: "Blacklisting is not available because Federation is not configured."
  operator_only: "This command is available to authenticated operators. Use <code>/auth &lt;access_token&gt;</code> first."
  usage: "<b>Usage</b>\n\n<code>/blacklist &lt;identifier&gt; &lt;report_uuid&gt; &lt;type&gt; &lt;expires&gt;</code>: blacklist an entity against an existing report.\nReply to a message and send <code>/blacklist &lt;report_uuid&gt; &lt;type&gt; &lt;expires&gt;</code> to blacklist the message author against an existing report.\nReply to a message and send <code>/blacklist &lt;type&gt; &lt;expires&gt;</code> to create a supporting report and blacklist the message author.\n\n<code>expires</code> accepts a duration with a unit suffix (<code>s</code>, <code>m</code>, <code>h</code> or <code>d</code>; plain numbers default to seconds), e.g. <code>30d</code> or <code>12h</code>.\n\nWithout replying, use <code>/blacklist &lt;identifier&gt; &lt;type&gt; &lt;expires&gt;</code> to blacklist without a report."
  invalid_type: "Unknown incident type <code>{0}</code>."
  invalid_expires: "Invalid expiration <code>{0}</code>. Use a duration such as <code>30d</code>, <code>12h</code> or <code>45m</code>."
  invalid_report: "Invalid report UUID <code>{0}</code>."
  cannot_be_reported: "This message cannot be reported."
  self_report: "You cannot report your own message."
  admin_report: "You cannot report an administrator of this chat."
  report_failed: "Failed to create the supporting report. The blacklist was not created."
