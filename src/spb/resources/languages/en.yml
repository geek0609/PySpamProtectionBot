    federation_access: "<b>Access:</b> {0}"
    federation_access_authenticated: "Authenticated (client permissions)"
    federation_access_anonymous: "Anonymous"
  scanning:
    title: "\U0001F50E <b>Scanning</b>\n\n"
    description: "Checks every member message against Federation recommendations for spam, phishing, malware, and other threats. How the bot responds depends on the behavior you choose.\n\n"
    privacy_mode_note: "Scanning sends only the message text or caption. It does not publish the sender or query the sender's Federation record."
    status: "<b>Status:</b> {0}"
    block_ads_trackers: "<b>Block Ads &amp; Trackers:</b> {0}"
    block_ads_trackers_description: "Also checks messages for advertising and tracking using the concerns supported by the Federation server. Enabled by default."
    enable_ads_trackers: "Enable Block Ads & Trackers"
    disable_ads_trackers: "Disable Block Ads & Trackers"
    level: "<b>Level:</b> {0}"
    notifications: "<b>Notifications:</b> {0}"
    notifications_unavailable: "<b>Notifications:</b> Unavailable until Moderator Notifications are enabled or a chat is linked"
    behavior_passive: "Passive"
    behavior_passive_description: "Only emits notifications and takes no automated action. Available only while scanning notifications are enabled, so moderators can review findings and act on their own."
    behavior_moderate: "Moderate"
    behavior_moderate_description: "Deletes blocked content and restricts members Federation recommends blocking. Cautioned messages are deleted only when they are anything other than plain text without URLs."
    behavior_strict: "Strict"
    behavior_strict_description: "Deletes blocked content, restricts cautioned members to text messages only, and bans members Federation recommends blocking, temporarily or permanently. Cautioned non-text messages are deleted."
  join_protection:
    title: "\U0001F6C2 <b>Join Protection</b>\n\n"
    description: "Checks each new member against Federation records when they join. Passive approves members and can report block recommendations to moderators. Moderate approves members and restricts those Federation recommends blocking, and can decline a blocked member's join request. Strict bans members Federation recommends blocking; join requests from those members are declined. Temporary recommendations end at the time supplied by Federation.\n\n"
    privacy_mode_note: "Join Protection still queries the new member so it can protect the chat, but it does not publish the member's profile or metadata."
    status: "<b>Status:</b> {0}"
    level: "<b>Level:</b> {0}"
    notifications: "<b>Notifications:</b> {0}"
    notifications_unavailable: "<b>Notifications:</b> Unavailable until Moderator Notifications are enabled or a chat is linked"
    behavior_moderate: "Moderate"
    behavior_moderate_description: "Approves members and restricts those Federation recommends blocking, and can decline a blocked member's join request rather than banning them."
    behavior_passive: "Passive"
    behavior_passive_description: "Approves members and does not automatically restrict or ban them. It can report Federation block recommendations to moderators."
    behavior_strict: "Strict"
    behavior_strict_description: "Bans members Federation recommends blocking, temporarily or permanently. Join requests from those members are declined."
  privacy:
    title: "\U0001F6E1\uFE0F <b>Privacy Mode</b>\n\n"
    description: "Minimizes routine data sent to Federation. It stops automatic entity publishing and makes scanning send only message content, without querying the sender. Features that need data to work still send the minimum required: Join Protection queries a new member without publishing their profile, and reports include their target, incident, and required evidence.\n\n"
    status: "<b>Status:</b> {0}"
  reporting:
    title: "\U0001F4DD <b>Reporting</b>\n\n"
    description: "Lets chat members report messages with <code>/report</code>. Reports include the selected incident type and the reported message as evidence.\n\n"
    privacy_mode_note: "Reports still include the reported member, incident type, message content, and comment needed to submit them. Chat, reporter, and message metadata, plus attachments, are omitted."
    status: "<b>Status:</b> {0}"
    notifications: "<b>Notifications:</b> {0}"
    notifications_unavailable: "<b>Notifications:</b> Unavailable until Moderator Notifications are enabled or a chat is linked"
  moderator_notifications:
    title: "\U0001F514 <b>Moderator Notifications</b>\n\n"
    description: "When enabled, every active moderator who can delete messages or restrict members receives moderation notifications privately.\n\n"
    status: "<b>Status:</b> {0}"
  channel:
    title: "\U0001F517 <b>Chat Linking</b>\n\n"
    description: "Connect a channel or group that should receive moderation notifications. The bot must be present in the target chat before it can deliver notifications there.\n\n"
    linked_chat: "<b>Linked chat:</b> {0}\n"
    status_not_linked: "<b>Status:</b> Not linked\n"
    post_command_instruction: "Post this command in the target chat: "
  privacy_mode_label: "\U0001F6E1\uFE0F <i>Privacy Mode is enabled:</i> "

