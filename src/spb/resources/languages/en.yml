secretary_settings:
  title: "\U0001F464 <b>Secretary Settings</b>\n\n"
  description: "Choose how Secretary Mode handles contacts you have not interacted with before. Secretary Mode maintains an allow/deny list for your conversations. Messages from allowed contacts are delivered normally without being deleted or scanned, while messages from denied contacts are automatically deleted. Messages from unknown contacts are checked against the federation server to determine how they should be handled."
  behavior: "<b>Behavior:</b> {0}"
  behavior_passive: "Passive"
  behavior_passive_description: "Only emits notifications and lets you decide. New contacts are allowed and their first message is kept in your chat after checking them against the Federation database, and a notification with Allow and Deny controls is always sent so you can review the recommendation and change the contact's state."
  behavior_strict: "Strict"
  behavior_strict_description: "Also applies the denial where applicable. New contacts are automatically allowed or denied based on the recommendation; denied messages are deleted, and a notification is sent for every decision with Allow and Deny controls so you can change the contact's state."
  scanning: "<b>Scanning:</b> {0}"
  scanning_enabled_description: "The text or caption of a first-contact message is sent to the Federation server for analysis together with the sender's record. If the message is falsely flagged, its content may appear in a Federation report."
  scanning_disabled_description: "Message content never leaves your chat; only the sender's Federation record is checked."
  enable_scanning: "Enable Scanning"
  disable_scanning: "Disable Scanning"
  contact_not_known: "\U0001F4AC <b>Contact Not Known</b>\n\nWhen a new person first messages you, they are checked against the Federation Database. They are then allowed or denied automatically and you receive a notification."
  contact_not_known_button: "Open Secretary Settings"
  contact_unknown: "Unknown"
  contact_allowed: "Allowed"
  contact_denied: "Denied"
  contact_title: "<b>Contact Settings</b>\n\n"
  contact_status: "<b>Status:</b> {0}\n"
  contact_not_known_hint: "<i>This contact is not in your allow/deny list yet.</i>\n\n"
  toast_behavior_changed: "Secretary behavior changed to {0}."
  toast_scanning_enabled: "Scanning enabled."
  toast_scanning_disabled: "Scanning disabled."
  toast_contact_allowed: "Contact allowed."
  toast_contact_denied: "Contact denied."
  session_expired: "This settings menu has expired. Send /settings to open it again."
  not_enabled: "\u26A0\uFE0F <b>Secretary mode is not enabled.</b>\n\nOpen Telegram &gt; Settings &gt; Business, connect this bot to your account, and grant it permission to delete messages. This restriction is removed and your settings are shown as soon as the connection exists."
