  scanning:
    title: "\U0001F50E <b>内容扫描</b>\n\n"
    description: "根据联邦系统的建议检查每位成员的消息，以防范垃圾信息、网络钓鱼、恶意软件和其他威胁。机器人的响应方式取决于您选择的行为模式。\n\n"
    privacy_mode_note: "扫描仅发送消息文本或附言。它不会公布发送者或查询发送者的联邦记录。"
    status: "<b>状态：</b> {0}"
    block_ads_trackers: "<b>拦截广告和跟踪器:</b> {0}"
    block_ads_trackers_description: "根据联邦服务器支持的类别，额外检查消息中的广告和跟踪内容。默认启用。"
    enable_ads_trackers: "启用广告和跟踪器拦截"
    disable_ads_trackers: "禁用广告和跟踪器拦截"
    level: "<b>级别：</b> {0}"
    notifications: "<b>通知：</b> {0}"
    notifications_unavailable: "<b>通知：</b> 不可用，请启用管理员通知或关联聊天"
    behavior_passive: "被动"
    behavior_passive_description: "仅发出通知，不采取自动操作。仅在启用扫描通知时可用，以便管理员审查发现的问题并自行采取行动。"
    behavior_moderate: "中等"
    behavior_moderate_description: "删除被封锁的内容，并对联邦系统建议封锁的成员进行限制。警告消息仅在其非无 URL 的纯文本时才会被删除。"
    behavior_strict: "严格"
    behavior_strict_description: "删除被封锁的内容，限制受警告的成员仅能发送文本消息，并对联邦系统建议封锁的成员进行临时或永久封禁。被警告的非文本消息将被删除。"
  join_protection:
    title: "\U0001F6C2 <b>进群保护</b>\n\n"
    description: "新成员加入时，对照联邦记录进行检查。被动模式批准成员入群，并可向管理员汇报封锁建议。中等模式批准成员入群，但限制联邦建议封锁的人，并可拒绝被封锁成员的入群请求。严格模式直接封禁联邦建议封锁的成员；来自这些成员的入群请求将被拒绝。临时建议会在联邦系统提供的时间结束。\n\n"
    privacy_mode_note: "进群保护仍会查询新成员以保护聊天，但不会公布该成员的资料或元数据。"
    status: "<b>Status:</b> {0}"
    level: "<b>级别：</b> {0}"
    notifications: "<b>通知：</b> {0}"
    notifications_unavailable: "<b>通知：</b> 不可用，请启用管理员通知或关联聊天"
    behavior_moderate: "中等"
    behavior_moderate_description: "批准成员入群，但限制联邦建议封锁的人，并可拒绝被封锁成员的入群请求，而非直接封禁。"
    behavior_passive: "被动"
    behavior_passive_description: "批准成员入群，不自动限制或封禁他们。可向管理员汇报联邦系统的封锁建议。"
    behavior_strict: "严格"
    behavior_strict_description: "临时或永久封禁联邦建议封锁的成员。来自这些成员的入群请求将被拒绝。"
  privacy:
    title: "\U0001F6E1\uFE0F <b>隐私模式</b>\n\n"
    description: "尽量减少向联邦服务器发送的常规数据。它会停止自动发布实体，并使扫描仅发送消息内容，而不查询发送者。需要数据才能运行的功能仍会发送所需的最小值：进群保护查询新成员而不公布其资料，举报则包含其目标、违规事件和必要的证据。\n\n"
    status: "<b>状态：</b> {0}"
  reporting:
    title: "\U0001F4DD <b>举报功能</b>\n\n"
    description: "允许聊天成员使用 <code>/report</code> 举报消息。举报包含选定的事件类型和被举报的消息作为证据。\n\n"
    privacy_mode_note: "举报仍包含被举报的成员、事件类型、消息内容以及提交举报所需的备注。聊天、举报者和消息的元数据，以及附件都会被省略。"
    status: "<b>状态：</b> {0}"
