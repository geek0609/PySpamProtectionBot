secretary_settings:
  title: "\U0001F464 <b>秘书设置</b>\n\n"
  description: "选择秘书模式如何处理您之前未互动过的联系人。秘书模式会维护一份对话的允许/拒绝列表。来自允许联系人的消息将正常传送，不会被删除或扫描；来自拒绝联系人的消息会被自动删除。来自未知联系人的消息将通过联邦服务器进行检查，以决定如何处理。"
  behavior: "<b>行为模式：</b> {0}"
  behavior_passive: "被动"
  behavior_passive_description: "仅发出通知，由您决定。对新联系人予以允许，并在与联邦数据库比对后将其第一条消息保留在您的聊天中，同时始终发送带有“允许”和“拒绝”控制项的通知，以便您审查建议并更改联系人状态。"
  behavior_strict: "严格"
  behavior_strict_description: "在适用时直接应用拒绝规则。根据建议自动允许或拒绝新联系人；被拒绝的消息将被删除，并且每次决策都会发送包含“允许”和“拒绝”控制项的通知，以便您更改联系人状态。"
  scanning: "<b>扫描：</b> {0}"
  scanning_enabled_description: "新联系人首条消息的文本或说明会连同发送者记录一起发送到联邦服务器进行分析。如果消息被误判，其内容可能会出现在联邦报告中。"
  scanning_disabled_description: "消息内容永远不会离开您的聊天；仅检查发送者的联邦记录。"
  enable_scanning: "启用扫描"
  disable_scanning: "禁用扫描"
  contact_not_known: "\U0001F4AC <b>未知联系人</b>\n\n当新人第一次给您发消息时，系统会通过联邦数据库检查他们。然后自动允许或拒绝他们，您会收到通知。"
  contact_not_known_button: "打开秘书设置"
