help_pages:
  main_title: "帮助"
  main_body: "使用下方按钮了解各项功能。\n\n<b>常规功能</b>\n\u2022 <code>/help</code>：显示此帮助菜单\n\u2022 <code>/start</code>：将机器人添加到群组，或打开您的个人菜单\n\u2022 <code>/settings</code>：打开配置菜单\n\u2022 <code>/language</code>：更改语言（别名：<code>/lang</code>）\n\u2022 <code>/ping</code>：检查机器人和联邦服务器的状态\n\n<b>群组保护</b>\n\u2022 <code>/report</code>：举报一条消息，或通过 UUID 查询现有举报\n\u2022 <code>/connect</code>：关联通知聊天或频道\n\n<b>联邦查询</b>\n\u2022 <code>/info</code>：查询联邦实体的记录和建议\n\u2022 <code>/evidence</code>：通过 UUID 查询联邦证据记录\n\n<b>联邦操作员</b>\n\u2022 <code>/auth</code>：使用联邦访问令牌登录\n\u2022 <code>/authinfo</code>：显示您的操作员身份和权限\n\u2022 <code>/deauth</code>：注销登录\n\u2022 <code>/blacklist</code>：针对某份举报将实体列入黑名单\n\u2022 <code>/link</code>：关联两个联邦实体"
  secretary_mode_title: "秘书模式"
  secretary_mode_body: "<b>秘书模式</b>\n\n秘书模式保护您的个人收件箱免受未知联系人的打扰。要使用该模式，请打开 Telegram &gt; 设置 &gt; 账号 &gt; 聊天自动化，连接此机器人，并授予其 <b>读取消息</b> 和 <b>删除收到的消息</b> 权限。\n\n当未知联系人第一次给您发送消息时，机器人会通过联邦服务器对其进行检查，然后根据您选择的行为模式自动处理：\n\n\u2022 <b>被动</b>：第一条消息总是允许并保留。每次决策都会通知您，以便您审查并在需要时更改设置。\n\u2022 <b>严格</b>：联系人会被自动允许或拒绝。被拒绝的消息将被删除，并且每次决策都会通知您。\n\n每条通知都包含 <b>允许</b> 和 <b>拒绝</b> 按钮，以便您覆盖机器人的决定。一旦您允许了某个联系人，他们就会被信任，不再接受检查；一旦您拒绝了某个联系人，他们的消息将被静默删除。您也可以在“秘书”菜单中管理联系人和设置。"
  chat_protection_title: "群组保护"
  chat_protection_body: "<b>群组保护</b>\n\n群组保护使机器人成为一名管理员，在群组聊天中打击垃圾信息和滥用行为。将机器人添加到您的群组，将其提拔为管理员，并在聊天中使用 <code>/start</code> 或 <code>/settings</code> 打开的配置菜单中启用保护。受保护的群组可以组合使用以下功能：\n\n\u2022 <b>内容扫描</b>：通过联邦服务器检查消息是否存在垃圾信息、网络钓鱼、恶意软件和其他威胁。根据设置的行为，机器人可以通知管理员、删除被标记的内容、限制发送者或封禁他们。\n\n\u2022 <b>进群保护</b>：新成员加入时会通过联邦服务器进行检查，因此可以在已知不良人员造成破坏之前限制或拒绝他们。\n\u2022 <b>举报功能</b>：成员可以使用 <code>/report</code> 来标记消息，举报将共享给联邦网络。与内容扫描和进群保护不同，此功能始终需要机器人自己的联邦访问令牌来携带客户端权限，没有匿名途径。\n\n每项功能都有自己的保护级别和通知设置，因此您可以精确微调机器人的严格程度。只要启用了通知，管理员就会在采取行动时收到提醒。"
  settings_title: "设置"
  settings_body: "<code>/settings</code> 命令可打开机器人的配置菜单，您可以在其中开启或关闭功能并调整机器人的行为方式。它的工作方式取决于您在何处发送该命令。\n\n请在下方选择一项设置以了解更多信息。"
  settings_scanning_title: "内容扫描"
  settings_scanning_body: "内容扫描仅在群组聊天中有效。启用后，机器人会通过联邦服务器检查每位成员消息的内容，以防范垃圾信息、网络钓鱼、恶意软件和其他威胁。除非开启了隐私模式，否则它还会对照发送者的联邦记录检查该发送者。机器人的响应方式取决于您选择的行为模式：\n\n\u2022 <b>被动</b>：仅通知管理员；不采取自动操作。仅在启用扫描通知时可用。\n\u2022 <b>中等</b>：被封锁的内容将被删除，并且联邦建议封锁的成员将被限制。\n\u2022 <b>严格</b>：被封锁的内容将被删除，受警告的成员被限制仅能发送文本消息，联邦建议封锁的成员将被封禁。\n\n在中等和严格级别下，受警告消息的处理方式相同：仅当它们包含纯文本及 URL 以外的任何内容时才会被删除。照片、视频、贴纸、其他媒体、包含链接的消息以及无文本的消息将被删除，而无 URL 的基本文本消息将被保留。当启用扫描通知时，管理员会收到有关已采取操作的提醒。当隐私模式开启时，仅消息文本或附言会发送至联邦；不会公布或查询发送者信息。"
  settings_join_protection_title: "进群保护"
  settings_join_protection_body: "进群保护仅在群组聊天中有效。启用后，每个新成员在加入时都会对照联邦服务器进行检查，以便在已知不良人员造成破坏前阻止他们。您选择的行为模式控制后续发生的事情：\n\n\u2022 <b>被动</b>：批准所有加入请求，并将联邦封锁建议汇报给管理员。\n\u2022 <b>中等</b>：批准加入，但限制联邦建议封锁的成员；可以拒绝被封锁成员的入群请求。\n\u2022 <b>严格</b>：封禁联邦建议封锁的成员，并拒绝来自他们的入群请求。\n\n当进群保护通知启用时，管理员会在采取任何操作时收到提醒。当隐私模式开启时，机器人仍会查询新成员以保护聊天，但不会公布其个人资料。"
  settings_reporting_title: "举报功能"
  settings_reporting_body: "举报功能仅在群组聊天中有效。成员可以回复一条消息并发送 <code>/report</code> 来标记该消息。每份举报都包含选定的事件类型和被举报的消息作为证据。\n\n举报会通知管理员以便他们进行审查，副本也会提交至联邦服务器。联邦服务器上的操作员利用这些举报来改进数据库，从而帮助识别垃圾信息、网络钓鱼、恶意软件和其他威胁。当隐私模式开启时，仅共享提交举报所需的最小值：被举报成员、事件类型、消息内容和备注。\n\n提交举报始终需要机器人自己的联邦访问令牌来携带客户端权限，服务器上没有匿名途径。当机器人没有令牌时，此页面不会出现在 <code>/settings</code> 中，且 <code>/report</code> 会解释原因。"
  settings_privacy_title: "隐私模式"
  settings_privacy_body: "隐私模式是一项群组保护设置，可在机器人继续保护聊天的同时，尽量减少向联邦服务器发送的常规数据。它会停止自动发布用户，并使扫描仅发送消息文本或附言，而不是同时也查询发送者。\n\n需要数据的功能仍会发送运行所需的最小值：进群保护仍查询新成员而不公布其资料，举报则包含提交所需的被举报成员、事件类型、消息内容和备注。"
  settings_moderator_notifications_title: "管理员通知"
  settings_moderator_notifications_body: "管理员通知仅在群组聊天中有效。启用后，每位拥有删除消息或限制成员权限的活跃管理员，都会在机器人采取行动时私密接收提醒，涵盖扫描、进群保护和举报事件。这是交付通知的一种方式；另一种方式是关联通知聊天。"
  settings_channel_linking_title: "聊天关联"
  settings_channel_linking_body: "聊天关联仅在群组聊天中有效。它关联了一个独立的频道或群组，该频道或群组也会接收机器人发送的管理通知，以便您保留其活动的专门日志。机器人必须存在于被关联的聊天中才能在那里发送通知。"
  federation_commands_title: "联邦命令"
  federation_commands_body: "<b>联邦命令</b>\n\n这些命令用于查询联邦信息或提交举报。可在任何聊天中使用。\n\n\u2022 <code>/info [target]</code>：查询实体的联邦记录：声誉值、白名单状态、与您的关系，以及包含建议操作和生效黑名单的联邦评估。若无目标，回复一条消息可查询其作者；直接发送则查询您自己。目标也可以是用户名、用户 ID、实体地址、UUID 或哈希值。\n\u2022 <code>/evidence &lt;uuid&gt;</code>：通过 ID 查询证据记录。显示其分类、内容、备注、涉及实体、提交者及所属举报；在群组聊天中，响应仅对您可见。\n\u2022 <code>/report</code>：在群组中回复一条消息并发送 <code>/report</code> 以打开举报对话框，或发送 <code>/report &lt;type&gt; [comment]</code> 直接提交。私密地将消息转发给机器人也会以相同方式举报。\n\u2022 <code>/report &lt;uuid&gt;</code>：通过 UUID 查询现有的举报。显示举报 ID、类型、状态、被举报实体、提交者以及任何证据。\n\n提交举报始终需要机器人自己的联邦访问令牌来携带客户端权限。与上述查询不同，服务器上没有匿名途径。"
  operator_usage_title: "操作员用法"
  operator_usage_body: "操作员用法适用于通过 <code>/auth</code> 鉴定的联邦操作员。这些命令使用调用操作员自己的权限来运行，而非机器人的权限。\n\n选择下方主题以了解更多信息。"
  operator_authentication_title: "身份验证"
  operator_authentication_body: "<b>身份验证</b>\n\n将您登录为联邦操作员，由联邦服务器签发的访问令牌进行标识。在您与机器人的私聊中使用。\n\n\u2022 <code>/auth &lt;access_token&gt;</code>：使用访问令牌登录。\n\u2022 <code>/authinfo</code>：显示您当前的操作员身份和权限：客户端、操作员、管理和自动分配权限。\n\u2022 <code>/deauth</code>：撤销您存储的凭据并注销。\n\n需要已验证操作员的命令（<code>/blacklist</code>、<code>/link</code> 以及关闭被分配的举报）均使用您自己存储的凭据，绝不使用机器人的凭据。"
  operator_blacklist_title: "拉黑操作"
  operator_blacklist_body: "<b>拉黑操作</b>\n\n<code>/blacklist</code> 在联邦服务器上拉黑一个实体，并由一份支持性举报提供依据。它接受三种形式：\n\n\u2022 <code>/blacklist &lt;identifier&gt; &lt;report_uuid&gt; &lt;type&gt; &lt;expires&gt;</code>：针对现有举报拉黑给定的实体。\n\u2022 <code>/blacklist &lt;report_uuid&gt; &lt;type&gt; &lt;expires&gt;</code> （回复消息）：针对现有举报拉黑被回复消息的作者。\n\u2022 <code>/blacklist &lt;type&gt; &lt;expires&gt;</code> （回复消息）：先为被回复消息的作者创建一份支持性举报，然后再据此拉黑他们。\n\n<code>expires</code> 是带有单位后缀的时长（<code>s</code>、<code>m</code>、<code>h</code>、<code>d</code>；纯数字默认为秒），例如 <code>30d</code> 或 <code>12h</code>。这需要在联邦服务器上拥有管理权限，并会根据您自己的操作员权限进行检查。"
  operator_linking_title: "关联实体"
  operator_linking_body: "<b>关联实体</b>\n\n<code>/link &lt;entity&gt; &lt;target&gt; &lt;type&gt;</code> 记录 <code>entity</code> 以 <code>type</code> 所描述的方式与 <code>target</code> 相关联：\n\n• <b>alternative</b>：<code>entity</code> 是 <code>target</code> 疑似的小号；该关联可能未经证实。\n• <b>proxy</b>：已确认 <code>entity</code> 代表 <code>target</code> 行事，例如转播其消息。\n• <b>child</b>：<code>entity</code> 是由 <code>target</code> 作为从属创建的，例如 <code>target</code> 设置的机器人账号。\n\n<code>entity</code> 和 <code>target</code> 可以是用户名、Telegram 用户 ID、Mention 提及、联邦 UUID、哈希值或实体地址。\n\n每个实体一次只能拥有一个出站关联，再次关联它会替换以前的目标，而不是叠加。但是，一个目标可以有任意数量的实体关联到它，多个账号就是通过这种方式绑定在一起的：将每个已知的小号、代理或子账号关联到同一个核心实体，而不是互相相互关联。通过 <code>/info</code> 或机器人自身的自动检查查询该集群中的任何实体，即可展现整个群体，因此抓住一个账号也就标记了它的关联账号。"
  operator_report_assignments_title: "举报分配"
  operator_report_assignments_body: "<b>举报分配</b>\n\n当有举报分配给您时，系统会向您的私聊发送一条 <code>#举报已分配</code> 通知。其中包含举报 ID、违规类型、被举报实体、提交者、创建时间、举报消息和证据列表。\n\n使用通知上的按钮将举报关闭为 <b>正常</b>、<b>可疑</b> 或 <b>恶意</b>。这些按钮在举报关闭前始终可用。"
link:
  usage: "用法：<code>/link &lt;entity&gt; &lt;target&gt; &lt;type&gt;</code>。实体和目标可以是用户名、Telegram 用户 ID、Mention 提及、联邦 UUID、哈希值或实体地址。类型必须是 <code>alternative</code>、<code>proxy</code> 或 <code>child</code> 之一。"
  not_authenticated: "您尚未通过联邦操作员身份验证。请先使用 <code>/auth &lt;token&gt;</code>。"
  federation_not_configured: "未配置联邦，因此无法设置关系。"
  entity_not_found: "没有联邦实体匹配 <code>{0}</code>。"
  target_not_found: "没有联邦目标实体匹配 <code>{0}</code>。"
  invalid_type: "关系类型 <code>{0}</code> 无效。请使用 <code>alternative</code>、<code>proxy</code> 或 <code>child</code>。"
  linked: "已将 <code>{0}</code> 关联到 <code>{1}</code> ({2})。"
  failed: "设置关系失败：{0}"