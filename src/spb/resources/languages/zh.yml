start:
  session_expired_private: "此配置会话已过期或对您无效。请在群组中重新发送 /start 以配置机器人。"
  startgroup_promote: "要开始使用，请将此机器人提拔为管理员，并赋予 <b>更改群组信息</b> 权限，然后在该聊天中发送 /start。"
  private_description: "这是一个适用于 Telegram 的开源开放联邦数据库客户端，允许群组管理员保护群组聊天免受滥用和垃圾信息的干扰。\n\n"
  getting_started_header: "<b>入门指南</b>\n"
  getting_started_private_body: "将此机器人添加到群组聊天中，并将其提拔为具有所需权限的管理员，以保护聊天免受垃圾发送者的侵害。\n\n或者打开 Telegram &gt; 设置 &gt; 账号 &gt; 聊天自动化，连接此机器人，并授予其 <b>读取消息</b> 和 <b>删除收到的消息</b> 权限，以保护您免受未知联系人的打扰。\n"
  getting_started_group_configurable: "点击下方的“配置”按钮即可私密配置机器人。\n"
  getting_started_group_permissions: "要开始使用，请确保此机器人具有以下权限：\n\u2022 更改群组信息\n\u2022 删除消息（可选）\n\u2022 封禁用户（可选）\n配置完成后，请重新发送 /start 命令\n"
  additional_help_header: "\n<b>帮助</b>\n"
  additional_help_body: "发送 /help 打开机器人的帮助菜单，其中解释了可用命令及其工作方式。\n"
  server_information_header: "\n<b>联邦信息</b>\n"
  server_name_label: "<b>服务器名称：</b> {0}\n"
  server_host_label: "<b>服务器主机：</b> {0}\n"
  server_api_version_label: "<b>服务器 API 版本：</b> {0}\n"

bot_added:
  permissions_required: "<b>感谢添加我！</b>\n\n为了保护此聊天，请将我提升为管理员并授予以下权限：\n\u2022 更改群组信息\n\u2022 删除消息（可选）\n\u2022 封禁用户（可选）\n\n完成后，管理员可以发送 /settings 来配置我。"
  ready: "<b>已准备好保护此聊天</b>\n\n拥有“更改群组信息”权限的管理员可以发送 /settings 来配置我。"

settings:
  admin_required: "只有具有 <b>更改群组信息</b> 权限的群组管理员才能打开设置菜单。"
  anonymous_sender: "此命令是以聊天的名义发送的，因此我无法判断是哪位管理员发送的。请从您自己的账号发送 <code>/settings</code> 以打开设置菜单；匿名管理员需要先关闭 <b>保持匿名</b>。"
  bot_admin_required: "机器人必须是具有 <b>更改群组信息</b> 权限的管理员才能显示设置菜单。"
  secretary_not_enabled: "<b>秘书模式已禁用。</b>\n\n要配置群组保护，请将机器人添加到群组并在那里发送 <code>/start</code>。要使用秘书模式，请打开 Telegram &gt; 设置 &gt; 企业，并将此机器人添加为管理者，授予其删除消息的权限。"

