  enabled_title: "\U0001F464 <b>秘书模式已启用</b>\n\n"
  enabled_body: "您已将我设为您的个人秘书。现在将监控来自您从未见过的人的消息。联邦系统将扫描他们的消息或查询其记录，并建议是否需要采取行动。"
  disabled_title: "\U0001F464 <b>秘书模式已禁用</b>\n\n"
