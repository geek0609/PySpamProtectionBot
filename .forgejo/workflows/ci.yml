name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  release:
    types: [created]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: spam-protection-bot
          path: dist/spb-*.whl
          retention-days: 7

  test:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: PySpamProtectionBot

      # PyFederation is not published, so its dev branch is installed from a checkout next to this
      # one, the same layout the Dockerfile's pyfederation build context expects.
      - name: Checkout PyFederation
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/PyFederation
          ref: dev
          path: PyFederation

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        working-directory: PySpamProtectionBot
        run: |
          python -m pip install --upgrade pip
          pip install ../PyFederation -e . --group dev

      - name: Check linting, formatting and types
        working-directory: PySpamProtectionBot
        run: make check

      - name: Run tests
        working-directory: PySpamProtectionBot
        run: make test

  release:
    needs: [build, test]
    if: github.event_name == 'release' && github.event.action == 'created'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: spam-protection-bot
          path: .

      - name: Upload release asset
        uses: softprops/action-gh-release@v1
        with:
          files: spb-*.whl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
